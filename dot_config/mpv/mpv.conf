# Video
vo=gpu-next
hwdec=auto-safe
gpu-api=vulkan

# Audio
audio-channels=stereo
volume=80
volume-max=150

# Subtitles
sub-auto=fuzzy
sub-font="UDEV Gothic 35NFLG"
sub-font-size=44
sub-color="#cdd6f4"
sub-border-color="#1e1e2e"
sub-border-size=2
sub-shadow-color="#00000088"
sub-shadow-offset=1

# UI
osd-font="UDEV Gothic 35NFLG"
osd-font-size=32
osd-color="#cdd6f4"
osd-border-color="#1e1e2e"
osd-bar-h=2
osd-duration=1500
osd-on-seek=msg-bar
autofit-larger=90%x90%
cursor-autohide=500
keep-open=yes
loop-file=inf

# Privacy: do not persist or load playback history.
save-position-on-quit=no
resume-playback=no
save-watch-history=no
write-filename-in-watch-later-config=no

# Screenshot
screenshot-format=png
screenshot-directory=~/Pictures/screenshots
screenshot-template="%F_%P"
