# Familiar video-player controls
LEFT        seek -5
RIGHT       seek 5
Shift+LEFT  seek -30
Shift+RIGHT seek 30
UP          add volume 5
DOWN        add volume -5
ENTER       cycle fullscreen

# Vim-style controls
h seek -5
l seek 5
H seek -30
L seek 30
j add volume -5
k add volume 5
g-g seek 0 absolute
G seek 100 absolute-percent
n playlist-next
p playlist-prev

# Track controls (j is used for volume in the Vim layout)
a cycle audio
c cycle sub
v cycle sub-visibility

# Mouse controls
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
WHEEL_LEFT  seek -10
WHEEL_RIGHT seek 10

# Quit without saving the current playback position.
q quit
Q quit

# The remaining useful mpv defaults still apply:
# SPACE: pause, f: fullscreen, [ / ]: speed, BS: reset speed
# a: audio track, c: subtitle track, v: subtitles on/off, s: screenshot
# n / p: next/previous playlist item, PGUP / PGDWN: chapter
